name: Déploiement VPS

# Redéploie BRICOLOC sur le VPS Combell à chaque push sur main.
# Prérequis : secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH
# (voir docs/DEPLOIEMENT.md § 8). Le VPS doit avoir le dépôt cloné dans VPS_PATH
# avec .env.production déjà configuré.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # bouton « Run workflow » manuel dans l'onglet Actions

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose --env-file .env.production up -d --build
            docker image prune -f
            echo "Déployé : $(git rev-parse --short HEAD)"
